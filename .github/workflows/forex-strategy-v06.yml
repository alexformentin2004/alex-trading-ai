name: Forex v0.6 H1 breakout experiment
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/strategy_v06.py','.github/workflows/forex-strategy-v06.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas yfinance==0.2.66
      - run: python forex/strategy_v06.py
      - uses: actions/upload-artifact@v4
        with:
          name: forex-v06-h1-research
          path: forex_v06_report/
          retention-days: 7
