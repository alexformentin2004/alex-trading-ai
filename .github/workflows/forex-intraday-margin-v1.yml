name: Forex intraday leveraged margin lab
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/intraday_margin_lab_v1.py','.github/workflows/forex-intraday-margin-v1.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance==0.2.66
      - run: python forex/intraday_margin_lab_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-margin-intraday-v1-report
          path: forex_margin_intraday_v1/
          retention-days: 14
