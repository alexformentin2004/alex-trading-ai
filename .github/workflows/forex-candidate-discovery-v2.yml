name: Forex candidate discovery v2
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/candidate_discovery_v2.py','.github/workflows/forex-candidate-discovery-v2.yml']
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance==0.2.66
      - run: python forex/candidate_discovery_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-candidate-discovery-v2-report
          path: forex_discovery_v2/
          retention-days: 14
