name: Forex 2.0 EUR portfolio and broker constraints
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/portfolio_core_v04.py','forex/test_portfolio_core_v04.py','.github/workflows/forex-portfolio-v04.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd forex && python -m unittest -v test_portfolio_core_v04
