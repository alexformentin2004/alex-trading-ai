name: Forex M1 three bots same history
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/m1_three_bots.py','.github/workflows/forex-m1-three-bots.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance==0.2.66
      - run: python forex/m1_three_bots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-m1-three-bots-report
          path: forex_m1_three_bots/
          retention-days: 14
