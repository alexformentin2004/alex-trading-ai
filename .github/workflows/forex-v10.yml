name: Forex v0.10 liquidity sweep retest research
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/mtf_scalping_v10.py','.github/workflows/forex-v10.yml']
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas yfinance==0.2.66
      - run: python forex/mtf_scalping_v10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-v10-sweep-retest
          path: forex_v10_report/
          retention-days: 7
