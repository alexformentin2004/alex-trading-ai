name: Forex 2.0 Session Edge backtest
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/session_edge_v11.py','.github/workflows/forex-session-edge-v11.yml']
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance==0.2.66
      - run: python forex/session_edge_v11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-edge-v11-report
          path: forex_session_edge_v11/
          retention-days: 7
