name: Forex aggressive 1000 percent research
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/aggressive_1000_lab_v1.py','.github/workflows/forex-aggressive-1000.yml']
  workflow_dispatch:
jobs:
  aggressive-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance==0.2.66
      - run: python forex/aggressive_1000_lab_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-aggressive-1000-report
          path: forex_aggressive_v1/
          retention-days: 14
