name: Forex v0.7 multi-position verification
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/strategy_v07.py','.github/workflows/forex-v07.yml']
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas yfinance==0.2.66
      - run: python forex/strategy_v07.py
      - uses: actions/upload-artifact@v4
        with:
          name: forex-v07-multi-position-report
          path: forex_v06_report/
          retention-days: 7
