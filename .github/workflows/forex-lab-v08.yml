name: Forex 2.0 automated hypothesis lab
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/automated_lab_v08.py','.github/workflows/forex-lab-v08.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance==0.2.66
      - run: python forex/automated_lab_v08.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-lab-v08-report
          path: forex_v08_lab/
          retention-days: 7
