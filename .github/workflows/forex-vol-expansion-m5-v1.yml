name: Forex volatility expansion M5 lab
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/vol_expansion_m5_v1.py','.github/workflows/forex-vol-expansion-m5-v1.yml']
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance==0.2.66
      - run: python forex/vol_expansion_m5_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-vol-expansion-m5-v1
          path: forex_vol_expansion_m5_v1/
          retention-days: 14
