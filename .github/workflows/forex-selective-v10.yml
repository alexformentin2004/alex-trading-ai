name: Forex v1.0 selective alpha research
on:
  push:
    branches: [forex-data-pipeline]
    paths: ['forex/selective_alpha_v10.py','.github/workflows/forex-selective-v10.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance==0.2.66
      - run: python forex/selective_alpha_v10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-selective-v10-report
          path: forex_v10_selective/
          retention-days: 7
